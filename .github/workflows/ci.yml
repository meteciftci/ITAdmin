name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse installer PowerShell
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -LiteralPath scripts/install -Filter '*.ps1' -File) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($error in $errors) {
                Write-Error "$($file.FullName): $($error.Message) at $($error.Extent.Text)"
              }
            }
          }
          if ($failed) { exit 1 }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/ITAdmin.slnx

      - name: Build
        run: dotnet build backend/ITAdmin.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/ITAdmin.slnx --configuration Release --no-build

      - name: Reject vulnerable dependencies
        run: |
          output="$(dotnet list backend/ITAdmin.slnx package --vulnerable --include-transitive)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -Eiq 'high|critical|yüksek|kritik'; then
            echo "::error::High or critical NuGet vulnerability detected."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build
        working-directory: frontend
        run: npm run build
