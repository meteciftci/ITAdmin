name: Publish release

# A production release has two consumers:
#   1. An operator performing first install receives one self-contained Windows ZIP. The target
#      server does not clone source, does not need Git, and does not contact GitHub during install.
#   2. An already-installed Host Agent may fetch refs/itadmin/dist/<version> for an explicitly
#      enabled in-app update. The Git distribution ref is therefore retained as an update transport,
#      not as the first-install transport.
#
# Both outputs are built from exactly the same annotated tag and staged distribution tree. Release
# timestamps and archive metadata are pinned to the annotated tagger timestamp so a retry of the
# same immutable release identity reproduces the same distribution commit and operator ZIP.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. 2.1.0"
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          tag="v${version}"

          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"

          tag_type="$(git cat-file -t "refs/tags/${tag}")"
          if [ "${tag_type}" != "tag" ]; then
            echo "::error::${tag} is a lightweight tag. Production releases must be annotated (git tag -a)."
            exit 1
          fi

          case "${version}" in
            *-*)
              echo "::error::${version} is a pre-release; the stable release workflow accepts stable versions only."
              exit 1
              ;;
          esac

          commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          timestamp="$(git for-each-ref --format='%(taggerdate:iso-strict)' "refs/tags/${tag}")"
          if [ -z "${timestamp}" ]; then
            echo "::error::${tag} has no tagger timestamp."
            exit 1
          fi
          description="$(git tag -l --format='%(contents:subject)' "${tag}" | head -n 1 | cut -c1-500)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${timestamp}" >> "$GITHUB_OUTPUT"
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          echo "ref=refs/itadmin/dist/${version}" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit
        shell: bash
        run: git checkout --detach "${{ steps.identity.outputs.commit }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate release source
        shell: bash
        run: |
          dotnet restore backend/ITAdmin.slnx
          dotnet test backend/ITAdmin.slnx -c Release --no-restore
          vulnerability_output="$(dotnet list backend/ITAdmin.slnx package --vulnerable --include-transitive)"
          printf '%s\n' "$vulnerability_output"
          if printf '%s\n' "$vulnerability_output" | grep -Eiq 'high|critical|yüksek|kritik'; then
            echo "::error::High or critical NuGet vulnerability detected."
            exit 1
          fi

      - name: Publish backend
        shell: bash
        run: |
          dotnet publish backend/src/ITAdmin.Api/ITAdmin.Api.csproj \
            -c Release -o artifacts/publish --no-self-contained -p:ContinuousIntegrationBuild=true
          rm -f artifacts/publish/appsettings.Development.json

      - name: Publish Host Agent
        shell: bash
        run: |
          dotnet publish backend/src/ITAdmin.HostAgent/ITAdmin.HostAgent.csproj \
            -c Release -r win-x64 --self-contained false -o artifacts/hostagent \
            -p:ContinuousIntegrationBuild=true

      - name: Publish Update Coordinator
        shell: bash
        run: |
          dotnet publish backend/src/ITAdmin.UpdateCoordinator/ITAdmin.UpdateCoordinator.csproj \
            -c Release -r win-x64 --self-contained false -o artifacts/update-coordinator \
            -p:ContinuousIntegrationBuild=true

      - name: Stage release-matched deployment tooling
        shell: bash
        run: |
          mkdir -p artifacts/deployment-tooling
          cp scripts/install/Install-ITAdmin.ps1 artifacts/deployment-tooling/

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build

      - name: Embed frontend
        shell: bash
        run: |
          mkdir -p artifacts/publish/wwwroot
          cp -R frontend/dist/. artifacts/publish/wwwroot/

      - name: Stage distribution tree
        shell: bash
        run: |
          set -euo pipefail
          migrations="$(ls backend/src/ITAdmin.Persistence/Migrations \
            | grep -E '^[0-9]{14}_.*\.cs$' | grep -v '\.Designer\.cs$' | sed 's/\.cs$//' | sort)"
          count="$(printf '%s\n' "${migrations}" | grep -c . || true)"
          latest="$(printf '%s\n' "${migrations}" | tail -n 1)"

          dotnet run --project backend/src/ITAdmin.Deployment/ITAdmin.Deployment.csproj \
            -c Release --no-launch-profile -- \
            dist-stage \
            --publish artifacts/publish \
            --output artifacts/dist \
            --host-agent artifacts/hostagent \
            --deployment-tooling artifacts/deployment-tooling \
            --update-coordinator artifacts/update-coordinator \
            --version "${{ steps.identity.outputs.version }}" \
            --tag "${{ steps.identity.outputs.tag }}" \
            --commit "${{ steps.identity.outputs.commit }}" \
            --description "${{ steps.identity.outputs.description }}" \
            --timestamp "${{ steps.identity.outputs.timestamp }}" \
            --latest-migration "${latest}" \
            --migration-count "${count}"

      - name: Verify staged distribution identity and integrity
        shell: bash
        run: |
          dotnet run --project backend/src/ITAdmin.Deployment/ITAdmin.Deployment.csproj \
            -c Release --no-launch-profile -- \
            dist-verify \
            --release-dir artifacts/dist \
            --version "${{ steps.identity.outputs.version }}" \
            --commit "${{ steps.identity.outputs.commit }}"

      - name: Build deterministic operator package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression

          $version = '${{ steps.identity.outputs.version }}'
          $fixedTimestamp = [DateTimeOffset]::Parse('${{ steps.identity.outputs.timestamp }}').ToUniversalTime()
          $packageRoot = Join-Path $PWD 'artifacts/package-root'
          $releaseRoot = Join-Path $packageRoot 'release'
          $outputRoot = Join-Path $PWD 'artifacts/releases'
          $zipName = "ITAdmin-$version-windows.zip"
          $zipRelative = "artifacts/releases/$zipName"
          $shaRelative = "$zipRelative.sha256"
          $zipPath = Join-Path $PWD ($zipRelative -replace '/', [IO.Path]::DirectorySeparatorChar)
          $shaPath = Join-Path $PWD ($shaRelative -replace '/', [IO.Path]::DirectorySeparatorChar)

          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $releaseRoot, $outputRoot -Force | Out-Null

          Copy-Item -LiteralPath 'scripts/install/Setup-ITAdmin.ps1' -Destination (Join-Path $packageRoot 'Setup-ITAdmin.ps1')
          Copy-Item -LiteralPath 'scripts/install/Configure-ITAdminUpdates.ps1' -Destination (Join-Path $packageRoot 'Configure-ITAdminUpdates.ps1')
          Copy-Item -Path 'artifacts/dist/*' -Destination $releaseRoot -Recurse -Force

          @(
            "ITAdmin $version - Windows installation package",
            "",
            "1. Extract this ZIP to a temporary folder on Windows Server 2022/2025.",
            "2. Open an elevated Windows PowerShell 5.1 session in that folder.",
            "3. Run: .\Setup-ITAdmin.ps1",
            "",
            "First installation is local/offline. Git and GitHub access are not required.",
            "Repository-backed in-app updates are optional and can be enabled after installation with",
            ".\Configure-ITAdminUpdates.ps1."
          ) | Set-Content -LiteralPath (Join-Path $packageRoot 'README.txt') -Encoding UTF8

          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          $rootPath = (Resolve-Path -LiteralPath $packageRoot).Path
          $fileStream = [IO.File]::Open($zipPath, [IO.FileMode]::CreateNew, [IO.FileAccess]::ReadWrite, [IO.FileShare]::None)
          try {
            $archive = New-Object IO.Compression.ZipArchive($fileStream, [IO.Compression.ZipArchiveMode]::Create, $true)
            try {
              $files = Get-ChildItem -LiteralPath $packageRoot -Recurse -File |
                Sort-Object { $_.FullName.Substring($rootPath.Length) }
              foreach ($file in $files) {
                $relative = $file.FullName.Substring($rootPath.Length).TrimStart('\', '/') -replace '\\', '/'
                $entry = $archive.CreateEntry($relative, [IO.Compression.CompressionLevel]::Optimal)
                $entry.LastWriteTime = $fixedTimestamp
                $entryStream = $entry.Open()
                $sourceStream = [IO.File]::OpenRead($file.FullName)
                try {
                  $sourceStream.CopyTo($entryStream)
                }
                finally {
                  $sourceStream.Dispose()
                  $entryStream.Dispose()
                }
              }
            }
            finally {
              $archive.Dispose()
            }
          }
          finally {
            $fileStream.Dispose()
          }

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -LiteralPath $shaPath -Encoding ASCII

          $probe = Join-Path $env:TEMP ("itadmin-package-probe-" + [guid]::NewGuid().ToString('N'))
          try {
            Expand-Archive -LiteralPath $zipPath -DestinationPath $probe -Force
            foreach ($required in @(
              'Setup-ITAdmin.ps1',
              'Configure-ITAdminUpdates.ps1',
              'release/release.manifest.json',
              'release/deployment-tooling/Install-ITAdmin.ps1')) {
              if (-not (Test-Path -LiteralPath (Join-Path $probe $required))) {
                throw "Published package is missing $required"
              }
            }
          }
          finally {
            Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue
          }

          "zip=$zipRelative" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha=$shaRelative" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish immutable distribution ref for optional in-app updates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/dist-repo
          mkdir -p artifacts/dist-repo
          cd artifacts/dist-repo
          git init --quiet
          git config user.name "ITAdmin Release"
          git config user.email "release@itadmin.invalid"
          cp -R ../dist/. .
          git add --all

          export GIT_AUTHOR_DATE='${{ steps.identity.outputs.timestamp }}'
          export GIT_COMMITTER_DATE='${{ steps.identity.outputs.timestamp }}'
          git commit --quiet \
            -m "ITAdmin ${{ steps.identity.outputs.version }} Windows payload" \
            -m "source-tag: ${{ steps.identity.outputs.tag }}" \
            -m "source-commit: ${{ steps.identity.outputs.commit }}"

          remote_url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          new_commit="$(git rev-parse HEAD)"
          existing_commit="$(git ls-remote "${remote_url}" '${{ steps.identity.outputs.ref }}' | awk '{print $1}')"

          if [ -z "${existing_commit}" ]; then
            git push "${remote_url}" "HEAD:${{ steps.identity.outputs.ref }}"
          elif [ "${existing_commit}" = "${new_commit}" ]; then
            echo "Distribution ref already contains the identical deterministic release; leaving it unchanged."
          else
            echo "::error::${{ steps.identity.outputs.ref }} already exists with different content. Published release refs are immutable."
            echo "::error::Existing ${existing_commit}; rebuilt ${new_commit}. Do not move or replace an already-published release."
            exit 1
          fi

      - name: Upload release package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITAdmin-${{ steps.identity.outputs.version }}-windows
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ steps.identity.outputs.tag }}'
          version='${{ steps.identity.outputs.version }}'
          commit='${{ steps.identity.outputs.commit }}'
          zip='${{ steps.package.outputs.zip }}'
          sha='${{ steps.package.outputs.sha }}'
          digest='${{ steps.package.outputs.sha256 }}'

          notes_file="${RUNNER_TEMP}/itadmin-release-notes.md"
          cat > "${notes_file}" <<EOF
          ## ITAdmin ${version}

          Production Windows installation package built from annotated tag \`${tag}\`.

          - Source commit: \`${commit}\`
          - First install: extract \`ITAdmin-${version}-windows.zip\` and run \`.\\Setup-ITAdmin.ps1\` from an elevated Windows PowerShell session.
          - First install does **not** require Git or GitHub access on the server.
          - ZIP SHA-256: \`${digest}\`
          - Repository-backed in-app updates are optional and remain available through the release distribution ref.
          EOF

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${zip}" "${sha}" --clobber
            gh release edit "${tag}" --title "ITAdmin ${version}" --notes-file "${notes_file}"
          else
            gh release create "${tag}" "${zip}" "${sha}" \
              --verify-tag \
              --title "ITAdmin ${version}" \
              --notes-file "${notes_file}"
          fi
